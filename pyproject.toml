[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drum-agent"
version = "1.0.0"
description = "Drum-set transcription and professional drum-chart engraving (LilyPond, MusicXML, MIDI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "librosa>=0.10",
  "soundfile>=0.12",
  "mido>=1.3",
  "pyyaml>=6.0",
  "xmlschema>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=7", "verovio>=4"]

[project.scripts]
drum-agent = "drum_agent.cli:main"

[tool.setuptools.packages.find]
include = ["drum_agent*"]

[tool.setuptools.package-data]
drum_agent = ["schemas/musicxml-4.0/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: end-to-end audio tests (FluidSynth + transcription)",
  "lilypond: needs LilyPond installed",
]
