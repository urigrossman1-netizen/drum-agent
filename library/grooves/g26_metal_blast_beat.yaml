# Blast beats at an extreme tempo: first the hammer blast (ride, snare and
# kick together on every 8th), then the traditional blast (ride and kick
# alternating with the snare in 16ths), and a fill down the toms.
title: "G26 Metal: Blast Beat"
chart_type: pattern_study
rights: original
tempo: 200
time: 4/4
tempo_text: Blast beat
patterns:
  blast:
    rd: "xxxxxxxx"
    sn: "xxxxxxxx"
    bd: "xxxxxxxx"
  traditional:
    rd: "x-x-x-x-x-x-x-x-"
    sn: "-x-x-x-x-x-x-x-x"
    bd: "x-x-x-x-x-x-x-x-"
    sticking: "RLRLRLRLRLRLRLRL"
  fill:
    sn: "xxxx----"
    t1: "----xx--"
    ft: "------xx"
    bd: "xxxxxxxx"
    sticking: "RLRLRLRL"
  ending:
    cr: "x-------"
    bd: "x-------"
sections:
  - label: Hammer blast
    bars: ["blast*2"]
  - label: Traditional blast
    bars: ["traditional*2", fill]
  - label: Out
    bars: [blast, ending]
