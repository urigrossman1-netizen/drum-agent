# Blast beat: at extreme tempo, the hands alternate (traditional blast) or play
# together with the kick on every 8th note. Here the hands play together:
# ride and snare on every 8th, kick on every 8th, then a hammer blast.
title: "G26 Metal: Blast Beat"
chart_type: pattern_study
rights: original
tempo: 200
time: 4/4
tempo_text: Blast beat
patterns:
  blast:
    rd: "xxxxxxxx"
    sn: "xxxxxxxx"
    bd: "xxxxxxxx"
  traditional:
    rd: "x-x-x-x-"
    sn: "-x-x-x-x"
    bd: "x-x-x-x-"
    sticking: "RLRLRLRL"
  fill:
    sn: "xxxx----"
    t1: "----xx--"
    ft: "------xx"
    bd: "xxxxxxxx"
    sticking: "RLRLRLRL"
  ending:
    cr: "x-------"
    bd: "x-------"
sections:
  - label: Hammer blast
    bars: ["blast*2", "traditional*2", fill]
  - label: Out
    bars: [blast, ending]
