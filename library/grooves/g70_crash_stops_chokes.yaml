# Stops and chokes: crash and bass drum together, the crash choked (grabbed
# with the hand, marked with a choke sign) so the band's stop is clean; rests
# hold the silence, then the groove comes back in.
title: "G70 Fill: Crash Stops and Chokes"
chart_type: pattern_study
rights: original
tempo: 112
time: 4/4
tempo_text: Rock
patterns:
  groove:
    hh: "x-x-|x-x-|x-x-|x-x-"
    sn: "----|x---|----|x---"
    bd: "x---|----|x-x-|----"
  stops:
    cr: "c---|----|c---|----"
    bd: "x---|----|x---|----"
  stops_b:
    cr: "c---|--c-|----|----"
    sn: "----|--x-|----|xxxx"
    bd: "x---|--x-|----|----"
    sticking: "----|----|----|RLRL"
  back:
    cr: "x---|----|----|----"
    hh: "--x-|x-x-|x-x-|x-x-"
    sn: "----|x---|----|x---"
    bd: "x---|----|x-x-|----"
sections:
  - label: Groove
    bars: [groove, groove]
  - label: Stops
    cue: band stops
    bars: [stops, stops_b]
  - label: Back in
    bars: [back, groove]
