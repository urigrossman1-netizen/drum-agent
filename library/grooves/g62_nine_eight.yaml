# 9/8 grouped 2+2+2+3 (not the compound 3+3+3): "1 2, 1 2, 1 2, 1 2 3", the
# lopsided pulse of many Balkan and Turkish rhythms. Bass drum on the first two
# groups, snare on the third and the long fourth.
