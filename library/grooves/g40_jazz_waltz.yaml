    rd: "x-xxx-"
    hf: "--x---"
    bd: "g-----"
  waltz_comp:
    rd: "x-xxx-"
    sn: "-----x"
    hf: "--x---"
    bd: "g-----"
  waltz_b:
    rd: "x-xxx-"
    sn: "---x--"
    hf: "--x-x-"
    bd: "g-----"
  ending:
    rd: "x-----"
    sn: "x-----"
    bd: "x-----"
sections:
