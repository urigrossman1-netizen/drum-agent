# Tribal tom groove: the floor tom carries the 8th-note pulse with the right
# hand, the left hand answers on tom 1 and the snare, the bass drum sits under
# the floor tom on 1, 3 and the "and" of 3, the hi-hat foot on 2 and 4. No stick
# cymbals until the crash at the end.
title: "G37 Toms: Tribal Floor-Tom Groove"
