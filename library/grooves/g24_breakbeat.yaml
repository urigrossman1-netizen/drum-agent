# Breakbeat: a funky, syncopated loop of the kind that gets sampled: the snare
# on 2, pushed to the "a" of 3 and the "and" of 4 in the main bar (on 2 and 4 in
# the answer bar), the kick dancing on the 16ths, and an open hi-hat lifting the
# end of the bar.
title: "G24 Breakbeat: Syncopated Loop"
chart_type: pattern_study
rights: original
tempo: 102
time: 4/4
tempo_text: Breakbeat
patterns:
  break:
    hh: "x-x-|x-x-|x-x-|x-o-"
    sn: "----|x--g|-g-x|--x-"
    bd: "x-x-|----|--x-|----"
  break_b:
    hh: "x-x-|x-x-|x-x-|x-x-"
    sn: "----|x--g|-g--|x--g"
    bd: "x-x-|---x|x-x-|----"
  fill:
    hh: "x-x-|x-x-|----|----"
    sn: "----|x--g|X-gX|-gX-"
    ft: "----|----|----|---x"
    bd: "x-x-|----|-x--|x---"
    sticking: "----|----|R-LR|-LRR"
  ending:
    cr: "x---|----|----|----"
    bd: "x---|----|----|----"
sections:
  - label: Break
    bars: [break, break_b, break, fill]
  - label: Out
    bars: [break_b, ending]
