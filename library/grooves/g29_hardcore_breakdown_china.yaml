# Hardcore half-time breakdown: quarter notes on the china, snare on 3, the
# bass drum locking with the guitar's chugs (16ths and an 8th-note triplet).
title: "G29 Hardcore: Half-Time Breakdown with China"
chart_type: pattern_study
rights: original
tempo: 140
time: 4/4
tempo_text: Breakdown, half-time
patterns:
  break:
    cn: "x---|x---|x---|x---"
    sn: "----|----|x---|----"
    bd: "x-xx|----|----|x-x-"
  break_b:
    cn: "x---|x---|x---|x---"
    sn: "----|----|x---|----"
    bd: "x-xx|-x--|----|xxx-"
  chug:
    cn: "x--|x--|x--|x--"
    sn: "---|---|x--|---"
    bd: "xxx|---|---|xxx"
  fill:
    cn: "x---|x---|----|----"
    sn: "----|----|x-x-|x-x-"
    ft: "----|----|-x-x|-x-x"
    bd: "x-xx|----|----|----"
    sticking: "----|----|LRLR|LRLR"
  ending:
    cr: "x---|----|----|----"
    bd: "x---|----|----|----"
sections:
  - label: Breakdown
    bars: [break, break_b, chug, fill]
  - label: Out
    bars: [break, ending]
