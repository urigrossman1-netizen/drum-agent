# Funk 16th-note groove: 8th notes on the hi-hat with the right hand, the left
# hand playing the backbeat and soft ghost notes (g) on the 16ths in between.
title: "G13 Funk: 16th-Note Ghost-Note Groove"
chart_type: pattern_study
rights: original
tempo: 94
time: 4/4
tempo_text: Funk
patterns:
  funk:
    hh: "x-x-|x-x-|x-x-|x-x-"
    sn: "-g-g|X--g|-g-g|X--g"
    bd: "x---|--x-|-x--|--x-"
    sticking: "RLRL|L-RL|RLRL|L-RL"
  funk_b:
    hh: "x-x-|x-o-|x-x-|x-o-"
    sn: "-g-g|X--g|-gg-|X--g"
    bd: "x--x|----|x--x|----"
    sticking: "RLRL|L-RL|RLL-|L-RL"
  fill:
    hh: "x-x-|x-x-|----|----"
    sn: "-g-g|X--g|XggX|gg--"
    t2: "----|----|----|--x-"
    ft: "----|----|----|---x"
    bd: "x---|--x-|----|----"
    sticking: "RLRL|L-RL|RLLR|LLRR"
  ending:
    cr: "x---|----|----|----"
    bd: "x---|----|----|----"
sections:
  - label: Funk
    bars: [funk, funk_b, funk, fill]
  - label: Out
    bars: [funk_b, ending]
