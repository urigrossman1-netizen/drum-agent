    hh: "x-x-x-x-"
    cs: "--x---x-"
    bd: "x---x---"
  verse_b:
    hh: "x-x-x-x-"
    cs: "--x---x-"
    bd: "x---x--x"
  chorus:
    rd: "x-xxx-xx"
    sn: "--x---x-"
    bd: "x---x---"
