# Country two-step: bass drum on 1 and 3, cross-stick (or snare) on 2 and 4,
# quarter-note hi-hat, a bouncy, cut-time feel. The chorus opens up to the
# ride with the snare.
title: "G31 Country: Two-Step"
chart_type: pattern_study
rights: original
tempo: 168
time: 4/4
tempo_text: Country two-step
