# Trap: half-time feel (snare on 3) at a slow tempo, a sparse 808-style bass
# drum, and hi-hat rolls: 16ths that break into 32nds and 16th-note triplets.
title: "G22 Trap: Hi-Hat Rolls"
chart_type: pattern_study
rights: original
tempo: 70
time: 4/4
tempo_text: Trap, half-time
patterns:
  trap:
    hh: "x-x-|x-x-|x-x-|xxxx"
    sn: "----|----|x---|----"
    bd: "x---|---x|----|--x-"
  roll32:
    hh: "x-x-|xxxxxxxx|x-x-|xxxx"
    sn: "----|--------|x---|----"
    bd: "x---|-------x|----|--x-"
  roll_trip:
    hh: "x-x-|xxxxxx|x-x-|xxxxxxxx"
    sn: "----|------|x---|--------"
    bd: "x--x|------|----|----x---"
  fill:
    hh: "x-x-|xxxxxx|----|----"
    sn: "----|------|xxxx|xxxx"
    bd: "x---|------|----|----"
    sticking: "----|------|RLRL|RLRL"
  ending:
    cr: "x---|----|----|----"
    bd: "x---|----|----|----"
sections:
  - label: Trap
    bars: [trap, roll32, trap, roll_trip, trap, fill]
  - label: Out
    bars: [ending]
