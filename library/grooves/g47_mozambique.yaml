# Mozambique-style groove: the right hand plays a 16th-based bell part on the
# cowbell, the left hand moves between snare and toms, the bass drum marks the
# "&" of 2 and beat 4. A two-bar phrase, felt in cut time.
title: "G47 Mozambique: Bell and Toms"
