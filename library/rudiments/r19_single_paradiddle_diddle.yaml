# PAS International Drum Rudiment 19: Single Paradiddle-Diddle.
# R L R R L L, accent on the lead stroke, in 16ths in 6/8. It does not alternate,
# so it is practised with each lead: right-hand bars, then left-hand bars.
title: "R19 Single Paradiddle-Diddle"
chart_type: pattern_study
rights: original
tempo: "4.=60"
time: 6/8
tempo_text: "16ths"
patterns:
  right_lead:
    sn:       "XxxxxxXxxxxx"
    sticking: "RLRRLLRLRRLL"
  left_lead:
    sn:       "XxxxxxXxxxxx"
    sticking: "LRLLRRLRLLRR"
sections:
  - label: Rudiment
    bars:
      - {pattern: right_lead, cue: "Right lead"}
      - {pattern: left_lead, cue: "Left lead"}
      - right_lead
      - left_lead
