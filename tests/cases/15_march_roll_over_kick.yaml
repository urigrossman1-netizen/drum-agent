# A street march for snare and bass drum. No cymbal plays anywhere, so the chart is
# one voice: stems up, accents above, no rests for the empty voice. A buzz roll over
# the bass drum can't share that voice with the kick, so its bar alone is written in
# two voices, the hands up and the feet down (the accent after the roll stays above,
# with no rest over it); the bars around it stay one voice. The tacet bar's rest is
# in the chart's one voice in the MusicXML too.
title: "Case 15: March, Roll over the Bass Drum"
artist: Drum Agent regression suite (original)
chart_type: pattern_study
rights: original
tempo: 112
time: 2/4
tempo_text: March
patterns:
  cadence:
    sn: "X-xx|x-X-"
    bd: "x---|x---"
    sticking: "R-LR|L-R-"
  cadence_b:
    sn: "f-xx|F---"
    bd: "x---|x---"
    sticking: "R-LR|L---"
  roll:
    sn: "r~~~|X---"
    bd: "x-x-|x---"
  tacet:
    sn: "----|----"
  ending:
    sn: "X---|----"
    bd: "x---|----"
sections:
  - label: A
    bars: [cadence, cadence_b, roll, tacet, cadence, cadence_b, roll, ending]
