# Temporary: measures drum separation (HTDemucs) before detection.
# Round 1, MDB Drums train split: band mixes all-5 onset F 0.696 -> 0.774. Round 2, the held-out
# test split (run once for this model): 0.591 -> 0.733 (track mean 0.654 -> 0.828; the drum-only
# stems score 0.830). Round 3, here: the synthetic evaluations with and without separation
# (CLAUDE.md: both eval scripts before and after; jazz and brush kits, band mixes).
name: Measure drum separation (temporary)

on:
  push:
    branches: [claude/peaceful-noether-qz2xmc]
    paths: [".github/workflows/eval-separation.yml"]

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: FluidSynth and the GM soundfont (for the synthetic evaluation)
        timeout-minutes: 25
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          opts="-o Acquire::http::Timeout=30 -o Acquire::Retries=3 -o DPkg::Lock::Timeout=120"
          sudo apt-get $opts update
          sudo DEBIAN_FRONTEND=noninteractive apt-get $opts install -y --no-install-recommends fluidsynth fluid-soundfont-gm
      - name: Install (CPU PyTorch, demucs)
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q -e . demucs mir_eval
          sudo scripts/install_lilypond.sh
      - name: Synthetic notation evaluation, separation off
        run: python scripts/eval_notation.py --jobs 4 --separate off
      - name: Synthetic notation evaluation, separation on (band conditions; drums-only never separated)
        env:
          DRUM_AGENT_TORCH_THREADS: "1"
        run: python scripts/eval_notation.py --jobs 4 --separate auto
      - name: Synthetic detection evaluation (detect() itself; separation is not part of it)
        run: python scripts/eval_detection.py
