# Puts the studio online on a public link for a few hours, on a GitHub-hosted runner: builds
# the server image (Dockerfile: LilyPond, FFmpeg, the drum separation, the sampled drums) and
# runs it as a shared server, opens a Cloudflare quick tunnel (a random
# https://*.trycloudflare.com address), tests the public address as a visitor
# (scripts/acceptance_run.py: a real recording uploaded, separated, transcribed, edited, saved,
# reopened, exported, scored against its annotations) and only then posts the link. Charts made
# in one run are cached for the next.
#
# Start it: change the date in .github/live-studio and commit (GitHub's web editor will do, on a
# phone too). "Run workflow" in the Actions tab works only once this file is on the default branch.
name: Live studio

on:
  push:
    branches: [claude/peaceful-noether-qz2xmc]
    paths: [".github/workflows/live-studio.yml", ".github/live-studio"]
  workflow_dispatch:
    inputs:
      hours:
        description: "Hours to keep the studio online (at most 5.5)"
        default: "5.5"

concurrency:
  group: live-studio
  cancel-in-progress: true

permissions:
  contents: read
  issues: write  # the link is posted to an issue, readable (and notified) while the run is going

env:
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
  SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      HOURS: ${{ inputs.hours || '5.5' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build the server image
        timeout-minutes: 30
        run: docker build -q -t drum-agent .

      - name: Restore the charts saved by the last run
        uses: actions/cache/restore@v4
        with:
          path: .studio-data
          key: studio-data-v3-${{ github.run_id }}
          restore-keys: studio-data-v3-  # v3: the server image's /data

      - name: Start the studio
        timeout-minutes: 5
        run: |
          mkdir -p .studio-data && sudo chown -R 1000:1000 .studio-data  # the image's user
          docker run -d --name studio -p 127.0.0.1:8000:8000 -v "$PWD/.studio-data:/data" \
            -e YOUTUBE_API_KEY -e SPOTIFY_CLIENT_ID -e SPOTIFY_CLIENT_SECRET drum-agent
          for _ in $(seq 1 180); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health)" = "200" ] && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health || { echo "The studio did not start:"; docker logs studio 2>&1 | tail -50; exit 1; }
          echo

      - name: Open the public link
        timeout-minutes: 5
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          nohup ./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8000 > tunnel.log 2>&1 &
          url=""
          for _ in $(seq 1 90); do
            url=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel.log | head -1)
            [ -n "$url" ] && break
            sleep 1
          done
          if [ -z "$url" ]; then cat tunnel.log; exit 1; fi
          echo "STUDIO URL: $url"
          # Check the link the way a visitor reaches it: through Cloudflare and back down the
          # tunnel (DNS over HTTPS, so a lookup made before the name existed isn't cached).
          sleep 5
          code=000
          for _ in $(seq 1 40); do
            code=$(curl -s -o /dev/null -m 10 --doh-url https://cloudflare-dns.com/dns-query \
                     -w '%{http_code}' "$url/api/health") || true
            [ "$code" = "200" ] && break
            sleep 3
          done
          if [ "$code" != "200" ]; then echo "The public link does not answer (HTTP $code):"; cat tunnel.log; exit 1; fi
          checked="Checked from the internet at $(date -u '+%H:%M UTC'): the link answers."
          echo "$checked"
          until_utc=$(date -u -d "+${HOURS%.*} hours" '+%H:%M UTC')
          {
            echo "## Drum Agent Studio is online"
            echo
            echo "**$url**"
            echo
            echo "Online until about $until_utc. Anyone with the link can use it while it is up."
            echo
            echo "$checked"
          } | tee -a "$GITHUB_STEP_SUMMARY" > link.md
          printf '\nTo start it again later: open %s, change the date and click "Commit changes".\n' "https://github.com/${{ github.repository }}/edit/${{ github.ref_name }}/.github/live-studio" >> link.md
          { echo "STUDIO_URL=$url"; echo "STUDIO_UNTIL=$until_utc"; } >> "$GITHUB_ENV"

      # The result goes into the issue either way; a failure is reported there and marks the step.
      - name: The public address, tested as a visitor
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set -o pipefail
          python -m pip install -q numpy soundfile mir_eval
          python scripts/eval_real.py --download > /dev/null
          host="${STUDIO_URL#https://}"
          for _ in $(seq 1 40); do getent hosts "$host" > /dev/null && break; sleep 3; done
          status=0
          python scripts/acceptance_run.py "$STUDIO_URL" --track Britpop --search "Back in Black - AC/DC" --expect-separation | tee acceptance.txt || status=$?
          {
            echo
            if [ "$status" = 0 ]; then
              echo "Tested through the public address at $(date -u '+%H:%M UTC') as a visitor: a real recording (MDB Drums) uploaded, the drums separated, transcribed, edited, saved, reopened and exported."
              grep -o "the chart against the annotations.*" acceptance.txt | sed 's/^/Accuracy of that chart: /'
            else
              echo "The visitor test through the public address failed at $(date -u '+%H:%M UTC'): $(grep -o 'FAILED.*' acceptance.txt | tail -1)"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY" >> link.md
          exit "$status"

      # One issue holds the current link: readable while the run is going (the run's log and
      # summary are not), and GitHub notifies the repository's owner. Each run updates it,
      # reopens it and comments. A failure here leaves the studio running.
      - name: Post the link to an issue
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Drum Agent Studio: live link"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 200 --json number,title \
                  --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ -z "$num" ]; then
            num=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file link.md | grep -o '[0-9]*$')
          else
            gh issue edit "$num" --repo "$GITHUB_REPOSITORY" --body-file link.md
            gh issue reopen "$num" --repo "$GITHUB_REPOSITORY" || true
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "Online again: $STUDIO_URL (until about $STUDIO_UNTIL)"
          fi
          echo "STUDIO_ISSUE=$num" >> "$GITHUB_ENV"

      - name: Keep it online
        run: |
          seconds=$(python -c "print(int(min(float('${HOURS}'), 5.5) * 3600))")
          end=$(( $(date +%s) + seconds ))
          while [ "$(date +%s)" -lt "$end" ]; do
            sleep 60
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health)" = "200" ] || {
              echo "The studio stopped:"; docker logs studio 2>&1 | tail -50; exit 1; }
            pgrep -f "cloudflared tunnel" > /dev/null || { echo "The tunnel stopped:"; tail -50 tunnel.log; exit 1; }
          done

      - name: Stop the studio
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker stop studio > /dev/null 2>&1 || true
          if [ -n "${STUDIO_ISSUE:-}" ]; then
            printf '## Drum Agent Studio is offline\n\nThe last link has stopped working. To start it again: open %s, change the date and click "Commit changes".\n' "https://github.com/${{ github.repository }}/edit/${{ github.ref_name }}/.github/live-studio" > link.md
            gh issue edit "$STUDIO_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file link.md || true
            gh issue close "$STUDIO_ISSUE" --repo "$GITHUB_REPOSITORY" --comment "Offline now." || true
          fi

      - name: Save the charts for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .studio-data
          key: studio-data-v3-${{ github.run_id }}
