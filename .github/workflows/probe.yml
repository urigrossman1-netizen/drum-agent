# Temporary: checks what GitHub-hosted runners can reach before the Windows app is built.
# Deleted once the answers are in.
name: Probe (temporary)

on:
  push:
    branches: [claude/peaceful-noether-qz2xmc]
    paths: [".github/workflows/probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: |
          python -m pip install -q -U "yt-dlp[default]"
          python -m yt_dlp --version
          node --version || true

      - name: Search YouTube (metadata only, nothing downloaded)
        continue-on-error: true
        run: |
          python -m yt_dlp --js-runtimes node --flat-playlist \
            --print "%(title)s | %(channel)s | %(duration)s s | %(webpage_url)s" "ytsearch3:Back in Black AC/DC"

      - name: Read one video page (metadata only)
        continue-on-error: true
        run: |
          python -m yt_dlp --js-runtimes node --skip-download \
            --print "%(title)s | %(duration)s s | %(license)s" "https://www.youtube.com/watch?v=aqz-KE-bpKQ"

      - name: Download the audio of a Creative Commons video (Big Buck Bunny, CC BY 3.0)
        continue-on-error: true
        run: |
          python -m yt_dlp --js-runtimes node -f "bestaudio" -o "probe.%(ext)s" "https://www.youtube.com/watch?v=aqz-KE-bpKQ"
          ls -la probe.* || true

      - name: Reachability of other downloads the app needs
        run: |
          for u in \
            "https://dl.fbaipublicfiles.com/demucs/hybrid_transformer/955717e8-8726e21a.th" \
            "https://gitlab.com/lilypond/lilypond/-/releases/v2.26.0/downloads/lilypond-2.26.0-mingw-x86_64.zip" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" \
            "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip"; do
            code=$(curl -s -o /dev/null -L -r 0-1023 -w '%{http_code}' "$u")
            echo "$code  $u"
          done
