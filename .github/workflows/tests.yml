# Runs the tests on every push to the working branches and on every pull request:
#  - the fast suite (pytest -m "not slow") on Linux and on Windows, the app's two homes;
#  - the browser journeys (tests/test_web_e2e.py: Playwright through node) on Linux.
#
# The pins here are the repository's own: LilyPond through scripts/install_lilypond.sh, the
# Windows tools through packaging/fetch_tools.py (both check SHA-256s).
name: Tests

on:
  push:
    branches: [claude/peaceful-noether-qz2xmc, claude/transcription-platform]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: The tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg fluidsynth fluid-soundfont-gm
          PREFIX="$HOME/.local" bash scripts/install_lilypond.sh
          echo "DRUM_AGENT_LILYPOND=$HOME/.local/lilypond-2.26.0/bin/lilypond" >> "$GITHUB_ENV"

      - name: Keep the Windows tools between runs
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: tools
          key: windows-tools-${{ hashFiles('packaging/fetch_tools.py') }}

      - name: The tools (Windows)
        if: runner.os == 'Windows'
        run: |
          [ -d tools/lilypond ] || python packaging/fetch_tools.py --platform windows --dest tools --sounds
          tools="$(cygpath -w "$PWD/tools")"
          echo "DRUM_AGENT_LILYPOND=$tools\\lilypond\\bin\\lilypond.exe" >> "$GITHUB_ENV"
          echo "DRUM_AGENT_SOUNDFONT=$tools\\soundfonts\\FluidR3_GM.sf2" >> "$GITHUB_ENV"
          echo "$tools\\ffmpeg\\bin" >> "$GITHUB_PATH"
          echo "$tools\\fluidsynth\\bin" >> "$GITHUB_PATH"

      - name: Install
        run: python -m pip install -q -e ".[test,web]"

      - name: The fast tests
        timeout-minutes: 30
        run: python -m pytest -q -m "not slow"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: The tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg fluidsynth fluid-soundfont-gm poppler-utils
          PREFIX="$HOME/.local" bash scripts/install_lilypond.sh
          echo "DRUM_AGENT_LILYPOND=$HOME/.local/lilypond-2.26.0/bin/lilypond" >> "$GITHUB_ENV"

      - name: Install, with a browser to drive
        run: |
          python -m pip install -q -e ".[test,web]"
          npm install --no-save --no-package-lock playwright@1.65.0
          npx playwright install --with-deps chromium

      - name: The browser journeys
        timeout-minutes: 45
        run: python -m pytest -q tests/test_web_e2e.py

      - name: What the browser saw
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: tests/_artifacts
          if-no-files-found: ignore
